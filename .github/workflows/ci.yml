name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · typecheck and tests
    runs-on: ubuntu-latest
    # Playwright's image has the three browsers and pinned fonts: layout results match a local Docker run.
    # Firefox needs the runner's user (1001), not root. Keep the tag in step with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          CI: true
          BROWSERS: chromium,firefox,webkit
      - name: Build the docs site
        if: matrix.node == 22
        run: npm run docs:build
      - name: fitlocale report
        if: always()
        uses: ./
        with:
          report-dir: test-results/fitlocale-report
          artifact-name: fitlocale-report-node-${{ matrix.node }}
          fitlocale-command: node dist/cli.js
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-node-${{ matrix.node }}
          path: test-results/
          retention-days: 7
