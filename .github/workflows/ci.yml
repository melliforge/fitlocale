name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} · typecheck and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run typecheck
      - run: npm test
        env:
          CI: true
          BROWSERS: chromium,firefox,webkit
      - name: Build the docs site
        if: matrix.node == 22
        run: npm run docs:build
      - name: fitlocale report
        if: always()
        uses: ./
        with:
          report-dir: test-results/fitlocale-report
          artifact-name: fitlocale-report-node-${{ matrix.node }}
          fitlocale-command: node dist/cli.js
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-node-${{ matrix.node }}
          path: test-results/
          retention-days: 7
