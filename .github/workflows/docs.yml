name: Docs site
run-name: Docs site ${{ github.sha }}

# Builds the VitePress site and deploys it to GitHub Pages. Pull requests only build it (in the Tests workflow).
on:
  push:
    branches: [main]
    paths: ['docs/**', 'examples/**', '.github/workflows/docs.yml']
  workflow_dispatch:

# The build job runs npm ci (and its install scripts): it gets read access only. Deploy rights are on the deploy job.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # last-updated dates and the sitemap's lastmod read git history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # A manual run from another branch builds the site but never deploys it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy to GitHub Pages
      id-token: write # prove the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
