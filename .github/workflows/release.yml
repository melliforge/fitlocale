name: Release to npm and GitHub
run-name: Release ${{ github.ref_name }}

# Push a tag like v1.2.3 (made by `npm version`) to test, stage the release on npm and create the GitHub Release.
# The npm trusted publisher allows staging only: the version goes live after a maintainer approves it on npmjs.com.
on:
  push:
    tags: ['v*.*.*']

# Two jobs: the one that installs dependencies and runs the tests has read access only. The one that can write
# (the GitHub Release, the v0 tag, npm trusted publishing) installs nothing: it stages the tarball the tests passed on.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
        env:
          CI: true

      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "$VERSION" > release-notes.md

      - name: Pack
        run: npm pack --ignore-scripts

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            *.tgz
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Stage on npm, create GitHub Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release, move the v0 tag
      id-token: write # npm trusted publishing (OIDC) and provenance; no npm token is stored
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v7
        with:
          name: release

      - name: Unpack the tested tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          tar -xzf ./*.tgz
          PKG_NAME=$(node -p "require('./package/package.json').name")
          PKG_VERSION=$(node -p "require('./package/package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the packed version $PKG_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PKG_NAME=$PKG_NAME" >> "$GITHUB_ENV"
          # Pre-releases such as 1.0.0-beta.1 go to the "next" dist-tag, not "latest".
          if [[ "$VERSION" == *-* ]]; then echo "NPM_TAG=next" >> "$GITHUB_ENV"; else echo "NPM_TAG=latest" >> "$GITHUB_ENV"; fi

      - name: Use npm 11 (trusted publishing and `npm stage` need a recent npm 11)
        run: npm install -g npm@11

      - name: Stage on npm (approve it on npmjs.com to publish)
        working-directory: package
        run: |
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$VERSION is already on npm; skipping."
          else
            # The files of the tested tarball (also attached to the GitHub Release), unpacked: nothing is rebuilt here.
            npm stage publish --ignore-scripts --access public --tag "$NPM_TAG"
            echo "::notice::$PKG_NAME@$VERSION is staged on npm. Approve it at https://www.npmjs.com (Staged Packages) to publish."
          fi

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [ "$NPM_TAG" = "next" ]; then PRERELEASE="--prerelease"; fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" "$PKG_NAME-$VERSION.tgz" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$PKG_NAME-$VERSION.tgz" \
              --title "$PKG_NAME $VERSION" --notes-file release-notes.md --verify-tag $PRERELEASE
          fi

      # Workflows can use the Action as melliforge/fitlocale@v0: point that tag at this release.
      - name: Move the major tag (v0) to this release
        if: env.NPM_TAG == 'latest'
        # The release is done by now: a refused tag push must not turn it red.
        continue-on-error: true
        run: |
          MAJOR="${VERSION%%.*}"
          git fetch --tags --force
          # Only the newest stable release of this major moves the tag: re-running an old release must not move it back.
          NEWEST=$(git tag --list "v${MAJOR}.*.*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ "$NEWEST" != "$GITHUB_REF_NAME" ]; then
            echo "::notice::$GITHUB_REF_NAME is not the newest v${MAJOR} release ($NEWEST); v${MAJOR} stays where it is."
            exit 0
          fi
          git tag -f "v${MAJOR}" "$GITHUB_SHA"
          git push -f origin "refs/tags/v${VERSION%%.*}"
