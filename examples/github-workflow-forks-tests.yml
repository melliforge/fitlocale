# .github/workflows/e2e.yml: runs a fork's code with a read-only token, and only uploads the report.
name: End-to-end tests
on:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: melliforge/fitlocale@v0
        if: always()
