name: 'fitlocale report'
description: 'Summarise fitlocale localization layout issues in the job summary and upload the HTML report.'
author: 'melliforge'
branding:
  icon: 'globe'
  color: 'blue'

# Run it after your Playwright tests, with `if: always()`, so the summary appears when tests fail too.
# It never fails the job: the test step already decided that.
inputs:
  report-dir:
    description: 'Directory the fitlocale reporter writes to (its outputDir).'
    default: 'fitlocale-report'
  artifact-name:
    description: 'Name of the uploaded report artifact.'
    default: 'fitlocale-report'
  max-rows:
    description: 'Most issues listed in the job summary table.'
    default: '50'
  fitlocale-command:
    description: "Command that runs the fitlocale CLI. Default: the project's node_modules/.bin/fitlocale, else npx fitlocale at this Action's major version (fitlocale@0 for @v0)."
    default: ''
  upload:
    description: "Send the report to fitlocale cloud, for a pull request comment and a hosted report. Needs a fitlocale plan and `permissions: id-token: write`."
    default: 'false'
  upload-url:
    description: 'fitlocale cloud address. Default: https://cloud.fitlocale.dev.'
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Summarise fitlocale results
      shell: bash
      env:
        REPORT_DIR: ${{ inputs.report-dir }}
        MAX_ROWS: ${{ inputs.max-rows }}
        FITLOCALE_COMMAND: ${{ inputs.fitlocale-command }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        # Without a local install, use the CLI of this Action's major version: @v0 → fitlocale@0, a branch → latest.
        MAJOR=$(printf '%s' "$ACTION_REF" | sed -nE 's/^v([0-9]+).*/\1/p')
        [ -n "$MAJOR" ] || MAJOR=latest
        fl() {
          # $FITLOCALE_COMMAND is unquoted on purpose: it may be a command with arguments.
          if [ -n "$FITLOCALE_COMMAND" ]; then $FITLOCALE_COMMAND "$@"
          elif [ -x node_modules/.bin/fitlocale ]; then node_modules/.bin/fitlocale "$@"
          else npx --yes "fitlocale@${MAJOR}" "$@"; fi
        }
        if [ -f "$REPORT_DIR/results.json" ]; then
          fl summary "$REPORT_DIR/results.json" --max-rows "$MAX_ROWS" >> "$GITHUB_STEP_SUMMARY" \
            || echo "::warning::fitlocale summary failed; the report artifact is still uploaded."
        else
          {
            echo '## fitlocale'
            echo
            echo "No results.json in \`$REPORT_DIR\`. Is the fitlocale reporter in playwright.config, with this outputDir?"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload the fitlocale report
      uses: actions/upload-artifact@v7
      # A second artifact with the same name in one run (matrix, shards) is an error: never fail the job for it.
      continue-on-error: true
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report-dir }}
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload to fitlocale cloud
      if: inputs.upload == 'true'
      # The upload prints a notice and exits 0 on every problem; this covers an older CLI without the command.
      continue-on-error: true
      shell: bash
      env:
        REPORT_DIR: ${{ inputs.report-dir }}
        FITLOCALE_COMMAND: ${{ inputs.fitlocale-command }}
        ACTION_REF: ${{ github.action_ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        UPLOAD_URL: ${{ inputs.upload-url }}
      run: |
        # Without a local install, use the CLI of this Action's major version: @v0 → fitlocale@0, a branch → latest.
        MAJOR=$(printf '%s' "$ACTION_REF" | sed -nE 's/^v([0-9]+).*/\1/p')
        [ -n "$MAJOR" ] || MAJOR=latest
        fl() {
          # $FITLOCALE_COMMAND is unquoted on purpose: it may be a command with arguments.
          if [ -n "$FITLOCALE_COMMAND" ]; then $FITLOCALE_COMMAND "$@"
          elif [ -x node_modules/.bin/fitlocale ]; then node_modules/.bin/fitlocale "$@"
          else npx --yes "fitlocale@${MAJOR}" "$@"; fi
        }
        args=("$REPORT_DIR")
        # Only a pull request's merge ref carries the PR: under pull_request_target the job runs on the base branch,
        # and its token would not match the PR number.
        case "$GITHUB_REF" in
          refs/pull/*/merge) [ -n "$PR_NUMBER" ] && args+=(--pr "$PR_NUMBER") ;;
        esac
        [ -n "$UPLOAD_URL" ] && args+=(--endpoint "$UPLOAD_URL")
        fl upload "${args[@]}"
